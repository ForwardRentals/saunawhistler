name: Pages HTTPS

on:
  workflow_dispatch:
  push:
    branches: [ccr-37201228-4vnmiv]

permissions:
  pages: write
  contents: read

jobs:
  https:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Changing Pages settings needs a token with Administration + Pages write;
      # the default GITHUB_TOKEN gets HTTP 403.
      GH_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
      REPO: ${{ github.repository }}
      CNAME: www.saunawhistler.com
    steps:
      - name: Check token
        run: test -n "$GH_TOKEN" || { echo 'Add a PAGES_ADMIN_TOKEN repo secret first'; exit 1; }
      - name: Re-add custom domain to trigger certificate
        run: |
          gh api -X PUT repos/$REPO/pages --input - <<< '{"cname":null}'
          sleep 10
          for i in 1 2 3 4 5; do
            gh api -X PUT repos/$REPO/pages -f cname="$CNAME" && exit 0
            sleep 10
          done
          exit 1
      - name: Wait for certificate, then enforce HTTPS
        run: |
          for i in $(seq 1 55); do
            state=$(gh api repos/$REPO/pages --jq '.https_certificate.state // "none"')
            echo "certificate: $state"
            if [ "$state" = approved ]; then
              gh api -X PUT repos/$REPO/pages -F https_enforced=true
              gh api repos/$REPO/pages
              exit 0
            fi
            sleep 60
          done
          echo "Certificate not approved yet"; gh api repos/$REPO/pages; exit 1
